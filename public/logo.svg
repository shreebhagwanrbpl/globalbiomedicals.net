<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark Brown to Rich Amber Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2F241E" />
      <stop offset="50%" stop-color="#6F4E37" />
      <stop offset="100%" stop-color="#8B5A2B" />
    </linearGradient>

    <!-- Warm Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3E0" />
      <stop offset="50%" stop-color="#E5A968" />
      <stop offset="100%" stop-color="#A06A3B" />
    </linearGradient>

    <!-- Medical Pulse Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F5EBDD" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Shield Background with Subtle Border -->
  <rect x="20" y="20" width="460" height="460" rx="90" fill="url(#bgGrad)" stroke="#C49A6C" stroke-width="4" />

  <!-- Outer Orbiting Dashed Ring -->
  <circle cx="250" cy="250" r="175" fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-dasharray="24 12" opacity="0.75" />

  <!-- Latitude & Longitude Lines representing Global Biomedicals -->
  <ellipse cx="250" cy="250" rx="155" ry="65" fill="none" stroke="#E5A968" stroke-width="6" opacity="0.35" transform="rotate(-30 250 250)" />
  <ellipse cx="250" cy="250" rx="65" ry="155" fill="none" stroke="#E5A968" stroke-width="6" opacity="0.35" transform="rotate(-30 250 250)" />

  <!-- Central Medical Cross -->
  <rect x="220" y="130" width="60" height="240" rx="20" fill="url(#crossGrad)" filter="url(#glow)" />
  <rect x="130" y="220" width="240" height="60" rx="20" fill="url(#crossGrad)" filter="url(#glow)" />

  <!-- Pulse / ECG Heartbeat Line Overlay -->
  <path d="M 100 250 L 175 250 L 195 190 L 220 310 L 255 160 L 285 300 L 308 250 L 400 250" 
        fill="none" 
        stroke="#6F4E37" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
  
  <path d="M 100 250 L 175 250 L 195 190 L 220 310 L 255 160 L 285 300 L 308 250 L 400 250" 
        fill="none" 
        stroke="#A06A3B" 
        stroke-width="10" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Glowing Pulse Pointer Dot -->
  <circle cx="255" cy="160" r="10" fill="#FFFDF9" filter="url(#glow)" />
</svg>
